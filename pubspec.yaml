name: belloxdydx
description: Belloxdydx - smash your 100 level exams.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  pdfx: ^2.6.0
  flutter_widget_from_html: ^0.15.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
