name: belloxdydx
description: Belloxdydx — smash your 100 level exams.
publish_to: "none"
version: 6.0.0+6

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- backend ----
  supabase_flutter: ^2.8.0        # auth, direct Postgres/RPC, realtime, storage
  http: ^1.2.2                    # the few remaining Vercel endpoints

  # ---- state & routing ----
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # ---- storage ----
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # ---- content rendering ----
  flutter_widget_from_html_core: ^0.15.2
  pdfx: ^2.9.0
  just_audio: ^0.9.42
  cached_network_image: ^3.4.1

  # ---- platform ----
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  app_links: ^6.3.2

  # ---- specific features ----
  youtube_player_iframe: ^5.2.0   # sanctioned YouTube playback
  webview_flutter: ^4.10.0        # ONLY the Office document viewer
  printing: ^5.13.4               # CGPA result sheet
  pdf: ^3.11.1

  crypto: ^3.0.3                  # stable cache keys for offline assets

  intl: ^0.19.0
  vector_math: ^2.1.4          # the 3D login intro's maths
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Both already in the tree as transitive dependencies; named here so
  # test/offline_test.dart can mock the documents directory and drive
  # the real OfflineStore against a real temporary folder.
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

  # Drives the REAL app on a real desktop target: a real filesystem, a
  # real HTTP stack, real files on disk. The widget tests cannot prove
  # the offline layer works end to end; this can.
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  fonts:
    # Variable fonts: one file per family, weights selected via
    # FontVariation in core/theme/typography.dart. Bundled rather than
    # fetched at runtime so the app renders correctly with no network.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
