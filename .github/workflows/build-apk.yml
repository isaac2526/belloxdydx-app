name: Build Belloxdydx APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create the Android shell around our code
        run: flutter create --org tech.isaacarinola --project-name belloxdydx --platforms android .

      - name: Install the screenshot killer
        run: cp native/MainActivity.kt android/app/src/main/kotlin/tech/isaacarinola/belloxdydx/MainActivity.kt

      - name: Proper app name
        run: sed -i 's/android:label="belloxdydx"/android:label="Belloxdydx"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Brand icon
        run: dart run flutter_launcher_icons

      - name: Build the APK
        run: flutter build apk --release

      - name: Build the Play Store bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: belloxdydx-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: belloxdydx-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
