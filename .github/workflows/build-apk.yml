name: Build Belloxdydx

# WHAT COSTS MONEY, AND WHAT DOES NOT.
#
# A private repository gets 2,000 free Actions minutes a month, and the
# macOS runner is billed at TEN TIMES the clock. One full build here was
# measured at 56 billable minutes — 2 for the tests, 14 for Android, and
# 40 for four real minutes of iOS. Every push was firing all three, so
# thirty-five pushes emptied the month.
#
# Now: the tests run on every push, because they are 2 minutes and they
# are the safety net. The installable files are built when Tutor Bello
# ASKS for them — the "Run workflow" button on the Actions tab, or a
# version tag. A normal day of work costs 2 minutes instead of 56.
on:
  push:
    branches: ["**"]
    # Tagging a version always builds everything.
    tags: ["v*"]
  # Press "Run workflow" on the Actions tab. Android is on by default;
  # iOS is the expensive one, so it is a box you tick.
  workflow_dispatch:
    inputs:
      android:
        description: "Build the Android APK and Play Store bundle"
        type: boolean
        default: true
      ios:
        description: "Build the unsigned iOS IPA (costs 10x the minutes)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  # ============================================================
  # Static checks. Runs first so a broken build fails in ~2 minutes
  # instead of after a full Android toolchain download.
  # ============================================================
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Run in the students' own timezone, not the runner's UTC.
      #
      # Every student of this app is in Nigeria. A date bug that only
      # appears at a non-zero UTC offset — and the "Tutor Bello last
      # updated" line had exactly one — is invisible on a UTC runner
      # and visible on every phone that matters.
      - name: Unit & widget tests
        run: flutter test --reporter expanded
        env:
          TZ: Africa/Lagos

  # ============================================================
  # Android — APK for direct install, AAB for the Play Store.
  # ============================================================
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    # Only when asked for, or when a version is tagged.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # The APK step measured twelve minutes, and most of that was
          # Gradle downloading the same dependencies from scratch every
          # single time. Caching them is one line and it is billed
          # minutes, not seconds.
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the Android shell
        run: |
          flutter create --org tech.isaacarinola --project-name belloxdydx \
            --platforms android .

      - name: Install the screenshot killer (FLAG_SECURE)
        run: |
          mkdir -p android/app/src/main/kotlin/tech/isaacarinola/belloxdydx
          cp native/MainActivity.kt \
            android/app/src/main/kotlin/tech/isaacarinola/belloxdydx/MainActivity.kt

      - name: Branded launch window
        run: |
          # The Android project is regenerated by `flutter create` on
          # every run, so anything hand-edited under android/ is lost.
          # These live in native/ and are copied back each build.
          cp -r native/res/. android/app/src/main/res/
          echo '----- launch_background.xml -----'
          cat android/app/src/main/res/drawable/launch_background.xml

      - name: Permissions, label and deep links
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || sed -i \
            's|<manifest \(.*\)>|<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>|' "$M"
          sed -i 's/android:label="belloxdydx"/android:label="Belloxdydx"/' "$M"
          python3 tools/patch_manifest.py
          echo '----- manifest -----'
          cat "$M"

      - run: flutter pub get

      - name: Brand icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --split-debug-info=build/symbols

      - name: Build Play Store bundle
        run: flutter build appbundle --release --split-debug-info=build/symbols

      - name: Report sizes
        run: |
          echo "### Android artefacts" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print "- APK: "$5}' >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/bundle/release/app-release.aab | awk '{print "- AAB: "$5}' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: belloxdydx-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: belloxdydx-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ============================================================
  # iOS — an UNSIGNED .ipa for testing.
  #
  # This must run on macOS: an IPA needs Xcode's toolchain, which does
  # not exist on Linux. No Apple developer account is needed for an
  # unsigned build — it installs on a jailbroken device, a simulator
  # via a re-sign, or through a tool like AltStore/Sideloadly.
  # ============================================================
  ios:
    name: iOS unsigned IPA
    runs-on: macos-14
    needs: analyze
    timeout-minutes: 30
    # THE EXPENSIVE ONE. macOS bills at ten times the clock, so four
    # real minutes here cost forty of the month's two thousand — 71% of
    # a full build, for a file that cannot be installed on a normal
    # iPhone without an Apple developer account anyway. It is off by
    # default and ticked when it is actually wanted.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.ios ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the iOS shell
        run: |
          flutter create --org tech.isaacarinola --project-name belloxdydx \
            --platforms ios .

      - name: Display name and permission strings
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Belloxdydx" "$P" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Belloxdydx" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Unlock Belloxdydx with Face ID so only you can open your account.'" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Attach an image to a question report.'" "$P" || true

      - name: Capture handling for iOS
        run: |
          # iOS cannot refuse a screenshot -- no API exists. What these
          # delegates do is what Apple actually allows: cover the
          # content while the screen is being RECORDED or mirrored, and
          # tell Dart after a still shot was taken so it can be
          # reported. native/ios is the source of truth; the generated
          # shell's own files are replaced each build.
          #
          # BOTH files, and the scene delegate is the one that matters.
          # The project declares UIApplicationSceneManifest, so the
          # window belongs to the scene and the application delegate's
          # `window` is nil -- which is why the method channel was never
          # created on any iPhone. Copying only AppDelegate.swift, as
          # this step used to, shipped that bug every build.
          cp native/ios/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp native/ios/SceneDelegate.swift ios/Runner/SceneDelegate.swift
          test -s ios/Runner/AppDelegate.swift
          test -s ios/Runner/SceneDelegate.swift
          # The scene delegate is only ever reached through this key, so
          # a build whose Info.plist lost it would silently go back to
          # having no native channel at all.
          /usr/libexec/PlistBuddy -c \
            "Print :UIApplicationSceneManifest:UISceneConfigurations" \
            ios/Runner/Info.plist > /dev/null

      - run: flutter pub get

      - name: Brand icon
        run: dart run flutter_launcher_icons

      - name: Build unsigned .app
        run: flutter build ios --release --no-codesign

      - name: Package it into an .ipa
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry belloxdydx-unsigned.ipa Payload
          cd -
          ls -lh build/ipa/belloxdydx-unsigned.ipa
          echo "### iOS artefact" >> $GITHUB_STEP_SUMMARY
          ls -lh build/ipa/belloxdydx-unsigned.ipa | awk '{print "- IPA (unsigned): "$5}' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: belloxdydx-ios-unsigned-ipa
          path: build/ipa/belloxdydx-unsigned.ipa
          if-no-files-found: error
